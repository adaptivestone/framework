# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # `engines` claims Node >= 24, so the floor must actually be exercised —
    # testing only the dev runtime leaves that claim unverified. 26 stays the
    # primary (coverage is uploaded from it); `fail-fast: false` so a
    # floor-only break doesn't mask the primary result, or vice versa.
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    env:
      LOGGER_CONSOLE_LEVEL: "error"
      REDIS_URI: redis://localhost

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: npm clean install
        run: npm ci

      - name: Run Test
        run: npm test

      - name: Upload results to Codecov
        if: matrix.node == '26'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.node == '26' }}
        uses: codecov/codecov-action@v6
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
